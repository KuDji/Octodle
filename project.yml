name: Octodle
options:
  bundleIdPrefix: com.kudji
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  OctodleKit:
    path: OctodleKit
targets:
  Octodle:
    type: application
    platform: iOS
    sources: [Octodle]
    dependencies:
      - package: OctodleKit
    info:
      path: Octodle/Info.plist
      properties:
        CFBundleDisplayName: Осьминогль
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kudji.octodle
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Octodle:
    build:
      targets:
        Octodle: all
    run:
      config: Debug
    archive:
      config: Release
